apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      automountServiceAccountToken: false
      containers:
        - name: checkout
          image: ai-sre-rca-validation-workload:local
          imagePullPolicy: Never
          env:
            - name: SERVICE_NAME
              value: checkout
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DEPLOYMENT_NAME
              value: checkout
            - name: OTLP_HTTP_URL
              value: http://tempo:4318/v1/traces
            - name: LOKI_PUSH_URL
              value: http://loki:3100/loki/api/v1/push
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: rca-validation
spec:
  type: NodePort
  selector:
    app: checkout
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
