# Opt-in Kafka failure/recovery fixture. This is for disposable Kind validation
# only; it is not a supported or hardened production Kafka deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      containers:
        - name: broker
          image: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: "/tmp/kraft-combined-logs"}
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          resources:
            requests: {cpu: 150m, memory: 512Mi}
            limits: {memory: 1200Mi}
          startupProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: rca-validation
spec:
  selector: {app: kafka}
  ports:
    - {name: kafka, port: 9092, targetPort: 9092}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels: {app: kafka-exporter}
  template:
    metadata:
      labels: {app: kafka-exporter}
    spec:
      containers:
        - name: exporter
          image: danielqsj/kafka-exporter:v1.10.0@sha256:346a53c2489a3530790d01f7b96632496d0d58926662f4c35bb65f569db2ab42
          args:
            - --kafka.server=kafka:9092
            - --topic.filter=^orders-events$
            - --group.filter=^checkout-workers$
            - --refresh.metadata=5s
            - --offset.show-all
          ports:
            - {name: metrics, containerPort: 9308}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /metrics, port: 9308}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: rca-validation
spec:
  selector: {app: kafka-exporter}
  ports:
    - {name: metrics, port: 9308, targetPort: 9308}
---
# Failure injects no traffic directly from the consumer: the validation
# runner owns the replica count. Recovery is scaling the same consumer to 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-validation-consumer
  namespace: rca-validation
spec:
  replicas: 0
  selector:
    matchLabels: {app: kafka-validation-consumer}
  template:
    metadata:
      labels: {app: kafka-validation-consumer}
    spec:
      containers:
        - name: consumer
          image: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
          command: ["/opt/kafka/bin/kafka-console-consumer.sh"]
          args: ["--bootstrap-server", "kafka:9092", "--topic", "orders-events", "--group", "checkout-workers", "--from-beginning", "--consumer-property", "enable.auto.commit=true"]
          resources:
            requests: {cpu: 30m, memory: 256Mi}
            limits: {memory: 512Mi}
