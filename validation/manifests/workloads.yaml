apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-target
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-target
  template:
    metadata:
      labels:
        app: oom-target
    spec:
      containers:
        - name: worker
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "awk 'BEGIN { for (i=0; i<20000000; i++) a[i]=i; while (1) {} }'"
          resources:
            requests:
              memory: 8Mi
              cpu: 10m
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oom-target
  namespace: rca-validation
spec:
  selector:
    app: oom-target
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-target
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-target
  template:
    metadata:
      labels:
        app: crashloop-target
    spec:
      containers:
        - name: worker
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo deliberate validation crash >&2; exit 42"]
---
apiVersion: v1
kind: Service
metadata:
  name: crashloop-target
  namespace: rca-validation
spec:
  selector:
    app: crashloop-target
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: failed-scheduling-target
  namespace: rca-validation
  labels:
    app: failed-scheduling-target
spec:
  restartPolicy: Never
  tolerations:
    - operator: Exists
  containers:
    - name: worker
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "1000"
          memory: 1Ti
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-victim
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-victim
  template:
    metadata:
      labels:
        app: inventory-victim
    spec:
      containers:
        - name: worker
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 5m
              memory: 4Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-victim
  namespace: rca-validation
spec:
  selector:
    app: inventory-victim
  ports:
    - port: 8080
      targetPort: 8080
