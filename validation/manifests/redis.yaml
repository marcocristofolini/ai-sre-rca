apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels: {app: cache}
  template:
    metadata:
      labels: {app: cache}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          args: ["redis-server", "--maxmemory", "16mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: rca-validation
spec:
  selector: {app: cache}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis-exporter}
  template:
    metadata:
      labels: {app: redis-exporter}
    spec:
      containers:
        - name: exporter
          image: oliver006/redis_exporter:v1.80.1@sha256:bac9872da2b48e6eebbffb11517a5dcda59958eda51e1e4231eeb5dd516b4a5f
          args: ["--redis.addr=redis://cache:6379"]
          ports:
            - {name: metrics, containerPort: 9121}
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {memory: 64Mi}
          readinessProbe:
            httpGet: {path: /metrics, port: 9121}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: rca-validation
spec:
  selector: {app: redis-exporter}
  ports:
    - {name: metrics, port: 9121, targetPort: 9121}
