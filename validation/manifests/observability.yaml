apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rca-validation
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s
    scrape_configs:
      - job_name: rc3-workload
        static_configs:
          - targets: ["rc3-workload:8080", "copilot-stateful:8080"]
      - job_name: postgres-exporter
        static_configs:
          - targets: ["postgres-exporter:9187"]
        relabel_configs:
          - target_label: instance
            replacement: "orders-db:5432"
      - job_name: redis-exporter
        static_configs:
          - targets: ["redis-exporter:9121"]
        relabel_configs:
          - target_label: instance
            replacement: "cache:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - {name: http, containerPort: 9090}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: rca-validation
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders-db}
  template:
    metadata:
      labels: {app: orders-db}
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          args: ["postgres", "-c", "max_connections=20"]
          env:
            - {name: POSTGRES_DB, value: "orders"}
            - {name: POSTGRES_USER, value: "postgres"}
            - {name: POSTGRES_PASSWORD, value: "validation"}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "orders"]
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: rca-validation
spec:
  selector: {app: orders-db}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres-exporter}
  template:
    metadata:
      labels: {app: postgres-exporter}
    spec:
      containers:
        - name: exporter
          image: prometheuscommunity/postgres-exporter:v0.19.0@sha256:e8a170b85eab07c75c2b0f3aa2806be5c2fe5bba46fd0336914e1f36572cde08
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://postgres:validation@orders-db:5432/orders?sslmode=disable"
          ports:
            - {name: metrics, containerPort: 9187}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: rca-validation
spec:
  selector: {app: postgres-exporter}
  ports:
    - {name: metrics, port: 9187, targetPort: 9187}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-connection-loader
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres-connection-loader}
  template:
    metadata:
      labels: {app: postgres-connection-loader}
    spec:
      containers:
        - name: loader
          image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h orders-db -U postgres -d orders; do sleep 1; done
              i=0
              while [ "$i" -lt 15 ]; do
                (echo "select 1;"; sleep 3600) | PGPASSWORD=validation psql -h orders-db -U postgres -d orders &
                i=$((i + 1))
              done
              wait
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: rca-validation
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /tmp/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      filesystem:
        directory: /tmp/loki/chunks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.4.2@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - {name: http, containerPort: 3100}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: rca-validation
spec:
  selector: {app: loki}
  ports:
    - {name: http, port: 3100, targetPort: 3100}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: rca-validation
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      max_block_duration: 1m
    compactor:
      compaction:
        block_retention: 1h
    storage:
      trace:
        backend: local
        wal:
          path: /tmp/tempo/wal
        local:
          path: /tmp/tempo/blocks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: rca-validation
spec:
  replicas: 1
  selector:
    matchLabels: {app: tempo}
  template:
    metadata:
      labels: {app: tempo}
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.7.2@sha256:4b0277a9b572a4b1fa43b01468e58911ec214dd69d033f2cd476596d14de9fe3
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - {name: http, containerPort: 3200}
            - {name: otlp-http, containerPort: 4318}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo}
      volumes:
        - name: config
          configMap: {name: tempo-config}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: rca-validation
spec:
  selector: {app: tempo}
  ports:
    - {name: http, port: 3200, targetPort: 3200}
    - {name: otlp-http, port: 4318, targetPort: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rc3-workload
  namespace: rca-validation
  annotations:
    ai-sre.io/telemetry-service: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: rc3-workload}
  template:
    metadata:
      labels:
        app: rc3-workload
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: workload
          image: ai-sre-rc3-workload:local
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - {name: LOKI_URL, value: "http://loki:3100/loki/api/v1/push"}
            - {name: TEMPO_URL, value: "http://tempo:4318/v1/traces"}
          ports:
            - {name: http, containerPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: rc3-workload
  namespace: rca-validation
spec:
  selector: {app: rc3-workload}
  ports:
    - {name: http, port: 8080, targetPort: 8080}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: copilot-stateful
  namespace: rca-validation
  annotations:
    ai-sre.io/telemetry-service: copilot-stateful
spec:
  serviceName: copilot-stateful
  replicas: 1
  selector:
    matchLabels: {app: copilot-stateful}
  template:
    metadata:
      labels: {app: copilot-stateful}
    spec:
      containers:
        - name: workload
          image: ai-sre-rc3-workload:local
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
          env:
            - {name: OTEL_SERVICE_NAME, value: copilot-stateful}
            - {name: WORKLOAD_KIND, value: StatefulSet}
            - {name: WORKLOAD_NAME, value: copilot-stateful}
            - {name: DEPENDENCY_DELAY_SECONDS, value: "0"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          ports:
            - {name: http, containerPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: copilot-stateful
  namespace: rca-validation
spec:
  clusterIP: None
  selector: {app: copilot-stateful}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
