backend:
  image:
    repository: ghcr.io/your-org/ai-sre-rca-backend
    tag: "0.1.0"
  replicas: 2
  service:
    port: 8080
  env:
    DEMO_MODE: "false"
    PROMETHEUS_URL: "http://prometheus-operated.monitoring.svc:9090"
    LOKI_URL: "http://loki-gateway.logging.svc:3100"
    ARGOCD_URL: "http://argocd-server.argocd.svc"
    CORS_ORIGINS: "http://ai-sre-rca-frontend"

frontend:
  image:
    repository: ghcr.io/your-org/ai-sre-rca-frontend
    tag: "0.1.0"
  replicas: 2
  service:
    port: 3000

serviceAccount:
  create: true
  name: ai-sre-rca

resources:
  backend:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1, memory: 512Mi }
  frontend:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
