{{- if .Values.remediator.enabled }}
{{- if .Values.remediator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.remediator.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
{{- range $namespace := .Values.remediator.targetNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-remediator-scale
  namespace: {{ $namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-remediator-scale
  namespace: {{ $namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.remediator.serviceAccount.name }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-remediator-scale
---
{{- end }}
{{- end }}
