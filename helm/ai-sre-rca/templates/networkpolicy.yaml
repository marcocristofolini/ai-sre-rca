{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  policyTypes: ["Ingress", "Egress"]
  ingress:
{{ toYaml .Values.networkPolicy.frontendIngress | indent 4 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- with .Values.networkPolicy.additionalFrontendEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-frontend
{{- with .Values.networkPolicy.additionalBackendIngress }}
{{ toYaml . | indent 4 }}
{{- end }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- with .Values.networkPolicy.backendEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- if .Values.inventoryCollector.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-inventory-collector
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-inventory-collector
  policyTypes: ["Egress"]
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- with .Values.networkPolicy.inventoryCollectorEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
{{- if .Values.remediator.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-remediator
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-remediator
  policyTypes: ["Ingress", "Egress"]
  ingress:
{{ toYaml .Values.networkPolicy.remediatorIngress | indent 4 }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- with .Values.networkPolicy.remediatorEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
