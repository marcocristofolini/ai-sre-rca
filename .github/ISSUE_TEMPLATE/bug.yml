name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and the expected result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / reproduction
      description: Include sanitized incident payloads, logs, or steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.2.1
