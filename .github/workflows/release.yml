name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.8.0-rc.3
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub prerelease
        required: true
        default: true
        type: boolean
      dry_run:
        description: Validate promotion without creating a tag or release
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  release:
    name: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate promotion request
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must be promoted from main; got $GITHUB_REF" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"
          actual_version="$(tr -d '\r\n' < VERSION)"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "VERSION=$actual_version does not match tag $RELEASE_TAG" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry-run: existing tag is allowed for validation: $RELEASE_TAG"
            else
              echo "Tag already exists: $RELEASE_TAG" >&2
              exit 1
            fi
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$actual_version" >> "$GITHUB_OUTPUT"

      - name: Require successful GitHub-first gate on this SHA
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              head_sha: context.sha,
              event: 'push',
              per_page: 100,
            });

            const gates = response.data.workflow_runs
              .filter(run =>
                run.name === 'GitHub-first gate' &&
                run.status === 'completed' &&
                run.conclusion === 'success'
              )
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (!gates.length) {
              core.setFailed(
                `No successful GitHub-first gate exists for main SHA ${context.sha}`
              );
              return;
            }

            const gate = gates[0];
            core.info(`Using GitHub-first gate run ${gate.id}: ${gate.html_url}`);
            core.setOutput('run_id', String(gate.id));
            core.setOutput('run_url', gate.html_url);

      - name: Download validation evidence from the gated run
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RUN_ID: ${{ steps.gate.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          gh run download "$GATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "real-environment-validation-$GATE_RUN_ID" \
            --dir release-evidence

      - name: Verify release evidence belongs to this commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('release-evidence/validation-report.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          if report.get('passed') is not True:
              raise SystemExit('validation-report.json is not a passing report')

          report_sha = (report.get('environment') or {}).get('git_sha')
          expected_sha = os.environ['GITHUB_SHA']
          if report_sha != expected_sha:
              raise SystemExit(
                  f'validation report SHA {report_sha!r} != release SHA {expected_sha!r}'
              )
          print(f'Validated release evidence for {expected_sha}')
          PY

      - name: Build release notes from changelog and evidence
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GATE_RUN_URL: ${{ steps.gate.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          tag = os.environ['RELEASE_TAG']
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          heading = f'## [{version}]'
          start = changelog.find(heading)
          if start < 0:
              raise SystemExit(f'CHANGELOG.md has no section for {version}')
          end = changelog.find('\n## [', start + len(heading))
          section = changelog[start:end if end >= 0 else None].strip()

          evidence = Path('release-evidence/validation-report.md').read_text(
              encoding='utf-8'
          ).strip()
          notes = (
              f'# {tag}\n\n'
              f'{section}\n\n'
              '## GitHub-first release gate\n\n'
              f'Validated commit: `{os.environ["GITHUB_SHA"]}`\n\n'
              f'Gate run: {os.environ["GATE_RUN_URL"]}\n\n'
              '## Attached real-environment evidence\n\n'
              f'{evidence}\n'
          )
          Path('release-notes.md').write_text(notes, encoding='utf-8')
          PY

      - name: Build source archives
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip \
            --prefix="ai-sre-rca-${RELEASE_TAG}/" \
            -o "dist/ai-sre-rca-${RELEASE_TAG}.zip" "$GITHUB_SHA"
          git archive --format=tar.gz \
            --prefix="ai-sre-rca-${RELEASE_TAG}/" \
            -o "dist/ai-sre-rca-${RELEASE_TAG}.tar.gz" "$GITHUB_SHA"

      - name: Create validated tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }} — GitHub-first validated release
          prerelease: ${{ inputs.prerelease }}
          body_path: release-notes.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            release-evidence/validation-report.json
            release-evidence/validation-report.md

      - name: Publish promotion summary
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GATE_RUN_URL: ${{ steps.gate.outputs.run_url }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Release promoted

          Tag: \`$RELEASE_TAG\`

          Commit: \`$GITHUB_SHA\`

          Gate: $GATE_RUN_URL

          Dry run: `$DRY_RUN`
          EOF
