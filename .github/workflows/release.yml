name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build source archives
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=ai-sre-rca-${GITHUB_REF_NAME}/ -o dist/ai-sre-rca-${GITHUB_REF_NAME}.zip HEAD
          git archive --format=tar.gz --prefix=ai-sre-rca-${GITHUB_REF_NAME}/ -o dist/ai-sre-rca-${GITHUB_REF_NAME}.tar.gz HEAD
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
