name: GitHub-first gate

on:
  workflow_run:
    workflows:
      - Real environment validation
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: github-first-gate-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve target commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for required GitHub workflows
        uses: actions/github-script@v8
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        with:
          script: |
            const required = [
              'CI',
              'CodeQL',
              'Real environment validation',
            ];
            const targetSha = process.env.TARGET_SHA;
            const deadline = Date.now() + 40 * 60 * 1000;

            function latestByName(runs, name) {
              return runs
                .filter(run => run.name === name)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            }

            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: targetSha,
                per_page: 100,
              });
              const runs = response.data.workflow_runs;
              const state = {};

              for (const name of required) {
                const run = latestByName(runs, name);
                state[name] = run ? {
                  id: run.id,
                  status: run.status,
                  conclusion: run.conclusion,
                  event: run.event,
                  html_url: run.html_url,
                } : null;
              }

              core.info(`Target SHA: ${targetSha}`);
              core.info(JSON.stringify(state, null, 2));

              const missing = required.filter(name => !state[name]);
              const failed = required.filter(name =>
                state[name]?.status === 'completed' &&
                state[name]?.conclusion !== 'success'
              );

              if (failed.length) {
                core.setFailed(
                  `GitHub-first gate failed for ${targetSha}: ${failed.join(', ')}`
                );
                return;
              }

              const allSuccessful = required.every(name =>
                state[name]?.status === 'completed' &&
                state[name]?.conclusion === 'success'
              );
              if (allSuccessful) {
                await core.summary
                  .addHeading('GitHub-first gate passed')
                  .addTable([
                    [{data: 'Workflow', header: true}, {data: 'Conclusion', header: true}, {data: 'Run', header: true}],
                    ...required.map(name => [
                      name,
                      state[name].conclusion,
                      `<a href="${state[name].html_url}">${state[name].id}</a>`,
                    ]),
                  ])
                  .addRaw(`\nCommit: \`${targetSha}\`\n`)
                  .addRaw(`Branch: \`${process.env.TARGET_BRANCH || 'unknown'}\`\n`)
                  .write();
                return;
              }

              if (missing.length) {
                core.info(`Waiting for workflow runs: ${missing.join(', ')}`);
              } else {
                core.info('Required workflows still running.');
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }

            core.setFailed(`Timed out waiting for required workflows on ${targetSha}`);
