name: Publish test images

on:
  workflow_run:
    workflows:
      - GitHub-first gate
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: publish-test-images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-sre-rca-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-sre-rca-frontend

    steps:
      - name: Resolve validated SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${GITHUB_SHA}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Require successful GitHub-first gate for target SHA
        uses: actions/github-script@v9
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              head_sha: process.env.TARGET_SHA,
              event: 'push',
              per_page: 100,
            });

            const gate = response.data.workflow_runs.find(run =>
              run.name === 'GitHub-first gate' &&
              run.status === 'completed' &&
              run.conclusion === 'success'
            );

            if (!gate) {
              core.setFailed(
                `No successful GitHub-first gate exists for ${process.env.TARGET_SHA}`
              );
              return;
            }
            core.info(`Validated by gate run ${gate.id}: ${gate.html_url}`);

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:edge
            ${{ env.BACKEND_IMAGE }}:sha-${{ steps.target.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:edge
            ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.target.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Publish summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Test images published

          Validated commit: `${{ steps.target.outputs.sha }}`

          - `${BACKEND_IMAGE}:edge`
          - `${BACKEND_IMAGE}:sha-${{ steps.target.outputs.short }}`
          - `${FRONTEND_IMAGE}:edge`
          - `${FRONTEND_IMAGE}:sha-${{ steps.target.outputs.short }}`
          EOF
