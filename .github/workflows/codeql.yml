name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: read
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v4

      # This repository is private and GitHub Code Security is not enabled.
      # Run CodeQL locally in the workflow and retain SARIF as an artifact
      # without calling the GitHub Code Scanning upload API.
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: sarif-results

      - uses: actions/upload-artifact@v7
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results/*.sarif
          if-no-files-found: error
          retention-days: 14
