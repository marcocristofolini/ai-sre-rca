name: Real environment validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-environment-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Test harness helpers
        run: python -m pytest -q validation

      - name: Install kind 0.33.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64             -o /tmp/kind
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind"             | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install kubectl 1.37.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl             -o /tmp/kubectl
          curl -fsSL             https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256             -o /tmp/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Run real environment validation
        run: |
          python validation/run.py             --report-dir validation-artifacts

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-environment-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            validation-artifacts/validation-report.json
            validation-artifacts/validation-report.md
