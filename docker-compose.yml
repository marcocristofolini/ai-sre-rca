services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ai_sre
      POSTGRES_PASSWORD: ai_sre
      POSTGRES_DB: ai_sre
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_sre"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://ai_sre:ai_sre@postgres:5432/ai_sre
      CORS_ORIGINS: http://localhost:3000
      LLM_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
